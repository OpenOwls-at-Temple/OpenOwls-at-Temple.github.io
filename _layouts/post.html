---
layout: default
---
<main style="padding-top: 6rem;">
  <article style="max-width: 760px; margin: 0 auto; padding: 3rem;">

    <a href="{{ page.project_url | default: '/' | relative_url }}" style="font-size: 0.85rem; color: var(--gray); display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:2rem;">← Back to project</a>

    <div class="section-label">Student Blog</div>
    <h1 style="font-family:var(--font-display);font-size:2.2rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.75rem;">{{ page.title }}</h1>

    <div style="display:flex; gap:1.5rem; align-items:center; margin-bottom:2.5rem; flex-wrap:wrap;">
      {% if page.author %}
      <span style="color:var(--gray-light);font-size:0.9rem;">✍️ {{ page.author }}</span>
      {% endif %}
      {% if page.project %}
      <span style="color:var(--gray);font-size:0.9rem;">📁 {{ page.project }}</span>
      {% endif %}
      {% if page.date %}
      <span style="color:var(--gray);font-size:0.9rem;">🗓 {{ page.date | date: "%B %Y" }}</span>
      {% endif %}
    </div>

    <div style="border-top:1px solid var(--border);padding-top:2rem;color:var(--gray-light);line-height:1.85;font-size:1rem;">
      {{ content }}
    </div>

  </article>
</main>
